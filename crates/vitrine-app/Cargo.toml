[package]
name = "vitrine-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "vitrine"
path = "src/main.rs"

[dependencies]
log = { version = "0.4.35", features = ["std"] }
serde_json = "1.0.154"
windows-numerics = "0.3"
slint = "1.18.1"
ureq = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
vitrine-desktop = { version = "2.0.2", path = "../vitrine-desktop" }
vitrine-render = { version = "2.0.2", path = "../vitrine-render" }
vitrine-script = { version = "2.0.2", path = "../vitrine-script" }
vitrine-system = { version = "2.0.2", path = "../vitrine-system" }
vitrine-widgets = { version = "2.0.2", path = "../vitrine-widgets" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_System_IO", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_System_SystemServices", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_System_DataExchange", "Win32_Graphics_Imaging"] }

[build-dependencies]
embed-resource = "3"
slint-build = "1.18.1"
serde_json = "1.0.154"
