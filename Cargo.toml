[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.2"
edition = "2024"
license = "MIT"
authors = ["Emanuele Frascella"]
repository = "https://github.com/frascella-dev/vitrine"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Dependencies (QuickJS above all) are optimised in dev builds too: unoptimised
# QuickJS is slow enough to trip the script time limit.
[profile.dev.package."*"]
opt-level = 2
